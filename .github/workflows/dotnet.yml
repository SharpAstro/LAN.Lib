name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # Patch component is github.run_number. The MAJOR.MINOR is deliberately not here any more: it
  # lives in the repo-root Directory.Build.props (VersionMajorMinor) and the build job reads it
  # back, so it cannot drift from what the packages declare. Bump it there, 1.0 -> 1.1 on minor
  # feature additions and 1.X -> 2.X on breaking API changes.
  # Within 1.2, no X.Y bump and NO value change: AssemblyVersion moved from the csproj into that same
  # repo-root Directory.Build.props. It was already derived, so LAN.Lib still builds 1.2.0.0 -- it just
  # sits next to the number now, and applies to every project in the repo rather than the one that
  # remembered to ask. AssemblyVersion is the value CI does NOT stamp (it passes -p:Version and
  # -p:FileVersion only), so a per-csproj literal wins in the build that ships: that is how DIR.Lib
  # published 6.4.0.0 for two majors and SdlVulkan.Renderer published 6.11.0.0. All seven sibling repos
  # now state the rule once, in the props file, with none left in any csproj.
  # 2.0 -- BEHAVIOUR CHANGE, and a wire-incompatible one: the discovery port moved from 52821 to 38821.
  # 52821 sat inside Windows' DYNAMIC port range (49152-65535), which is exactly where Hyper-V, WSL and
  # Docker carve their exclusions (netsh int ipv4 show excludedportrange protocol=udp). On an ordinary
  # developer box it landed inside one, every bind failed with WSAEACCES 10013, and because
  # UdpLanTransport's constructor runs at DI resolution that took a whole consuming GUI down before its
  # first frame, over a feature the app can live without. 38821 is in the registered range, unassigned,
  # and never reserved dynamically. A 1.x node and a 2.0 node therefore NEVER SEE EACH OTHER -- both ends
  # of a session have to be on the same major, which is what makes this a major bump rather than a minor.
  # Second, independent half of the fix: a bind failure no longer throws. UdpLanTransport catches the
  # SocketException and degrades to announce-only (sending from an unbound socket still works, so the node
  # is heard but deaf), reporting it through the NEW ILanTransport.Degradation -- a DEFAULT interface
  # member, so a bespoke or fake transport need not know the concept. LanDiscoveryHostedService logs it
  # once as a warning; LanDiscovery re-exposes it for a host driving discovery directly rather than
  # through the hosted service. Nothing in the library acts on it beyond that, because discovery is
  # best-effort by nature and the application must stay usable without it. Also NEW:
  # LanDiscoveryOptions.DiscoveryPort, for the box where even 38821 is reserved -- but it is a shared
  # broadcast domain, so a lone deviation hears nobody.
  # NOT included: no change to the ANNOUNCE/BYE grammar or the SALAN magic (LanProtocol.Version stays 1),
  # and no change to beacon/expiry cadence. Only the port number and the bind-failure path moved.
  VERSION_REV: ${{ github.run_attempt }}
  VERSION_HASH: +${{ github.sha }}
  BUILD_CONF: Release
  # The build job CAPTURES a dotnet invocation's stdout to resolve the version, so the SDK's
  # first-run banner must not be able to land in it.
  DOTNET_NOLOGO: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Resolve version prefix
      # Read the major.minor back from the one place it is written (Directory.Build.props) instead of
      # restating it here. -getProperty only EVALUATES the file: nothing is built and no restore is
      # needed, so this can run before restore. The value is CAPTURED, so nothing else may print to
      # stdout: DOTNET_NOLOGO (workflow env) keeps the SDK first-run banner out, and the shape check
      # makes anything unexpected, or a renamed property, fail the run rather than quietly publishing
      # every package as ".<run>".
      run: |
        MM="$(dotnet msbuild Directory.Build.props -getProperty:VersionMajorMinor -nologo)"
        case "$MM" in
          [0-9]*.[0-9]*) ;;
          *) echo "::error::VersionMajorMinor did not resolve from Directory.Build.props (got '$MM')"; exit 1 ;;
        esac
        echo "VERSION_PREFIX=${MM}.${{ github.run_number }}" >> "$GITHUB_ENV"
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build -c $BUILD_CONF --no-restore -p:Version=${VERSION_PREFIX}${VERSION_REV}${VERSION_HASH} -p:FileVersion=${VERSION_PREFIX}.${VERSION_REV} -p:ContinuousIntegrationBuild=true
    - name: Test
      run: dotnet test src/LAN.Lib.Tests -c $BUILD_CONF --no-build --logger "console;verbosity=detailed"
    - name: Upload NuGet package
      uses: actions/upload-artifact@v7
      with:
        name: nuget-packages
        path: '**/*.nupkg'
        retention-days: 5

  publish-nuget:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
    - name: Download NuGet packages
      uses: actions/download-artifact@v8
      with:
        name: nuget-packages
    - name: Push NuGet package
      run: dotnet nuget push **/*.nupkg -s nuget.org -k ${{ secrets.NUGET_API_KEY }} --skip-duplicate
